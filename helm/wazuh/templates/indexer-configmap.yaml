{{/*
=============================================================================
Wazuh Indexer - ConfigMap (opensearch.yml)
=============================================================================
Fornece o arquivo de configuração principal do OpenSearch.
A imagem Wazuh escreve env vars no opensearch.yml via entrypoint; como o arquivo
é montado como readOnly, todas as configurações necessárias devem estar aqui.

IMPORTANTE:
- Configurações do security plugin (plugins.security.*) DEVEM estar no opensearch.yml.
- Configurações de cluster/discovery também devem estar aqui (env vars sozinhas
  não funcionam quando o arquivo é montado como readOnly pelo ConfigMap).
=============================================================================
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.indexer.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
data:
  opensearch.yml: |
    # Cluster e nó
    cluster.name: wazuh
    node.name: ${HOSTNAME}
    network.host: "0.0.0.0"

    # Descoberta do cluster (necessário quando network.host != loopback)
    cluster.initial_cluster_manager_nodes:
      - {{ printf "%s-0" (include "wazuh.indexer.fullname" .) }}
    discovery.seed_hosts:
      - {{ include "wazuh.indexer.svc" . }}

    # Nós de armazenamento locais (máx por host)
    node.max_local_storage_nodes: {{ .Values.indexer.replicas }}

    # TLS para comunicação HTTP (REST API)
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: certs/indexer.pem
    plugins.security.ssl.http.pemkey_filepath: certs/indexer-key.pem
    plugins.security.ssl.http.pemtrustedcas_filepath: certs/root-ca.pem

    # TLS para comunicação entre nós do cluster (transport)
    plugins.security.ssl.transport.pemcert_filepath: certs/indexer.pem
    plugins.security.ssl.transport.pemkey_filepath: certs/indexer-key.pem
    plugins.security.ssl.transport.pemtrustedcas_filepath: certs/root-ca.pem
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.transport.resolve_hostname: false

    # DN do certificado admin (deve coincidir exatamente com o CN gerado)
    plugins.security.authcz.admin_dn:
      - "CN=admin,OU={{ .Values.certs.subject.organizationalUnit }},O={{ .Values.certs.subject.organization }},L={{ .Values.certs.subject.locality }},ST={{ .Values.certs.subject.state }},C={{ .Values.certs.subject.country }}"

    # DN dos nós do indexer (deve coincidir com o CN do cert do indexer)
    plugins.security.nodes_dn:
      - "CN=indexer,OU={{ .Values.certs.subject.organizationalUnit }},O={{ .Values.certs.subject.organization }},L={{ .Values.certs.subject.locality }},ST={{ .Values.certs.subject.state }},C={{ .Values.certs.subject.country }}"

    # Inicializa automaticamente o índice de segurança (.opendistro_security)
    # na primeira execução, sem precisar rodar securityadmin manualmente
    plugins.security.allow_default_init_securityindex: true

    # Permite acesso à REST API de segurança para roles de admin
    plugins.security.restapi.roles_enabled:
      - "all_access"
      - "security_rest_api_access"

    # Compatibilidade com clientes Elasticsearch 7.x (ex: Filebeat 7.x)
    # Faz o OpenSearch reportar-se como ES 7.10.2 e aceitar _type no bulk API
    compatibility.override_main_response_version: true
