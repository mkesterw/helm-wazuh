{{/*
=============================================================================
Wazuh Dashboard - Service
=============================================================================
Expõe o dashboard na porta 443 (HTTPS).
Tipo padrão: ClusterIP (acesso via Ingress ou port-forward).
Para acesso externo direto: service.dashboard.type: LoadBalancer
=============================================================================
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.dashboard.svc" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.service.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dashboard.type }}
  selector:
    {{- include "wazuh.dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.service.dashboard.port }}
      targetPort: 443
      protocol: TCP
