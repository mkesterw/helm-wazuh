{{/*
=============================================================================
Wazuh Dashboard - Deployment
=============================================================================
Interface web do Wazuh (baseada em OpenSearch Dashboards).
Conecta-se ao Wazuh Indexer (porta 9200) e à API do Manager (porta 55000).
Expõe HTTPS na porta 443 com TLS passthrough.
=============================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wazuh.dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "wazuh.dashboard.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "wazuh.dashboard.selectorLabels" . | nindent 8 }}
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wazuh.serviceAccountName" . }}
      {{- if .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      {{- end }}

      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: dashboard-certs
          secret:
            secretName: {{ include "wazuh.secret.dashboardCerts" . }}
        {{- with .Values.dashboard.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      containers:
        - name: wazuh-dashboard
          image: {{ include "wazuh.image.dashboard" . | quote }}
          imagePullPolicy: {{ .Values.image.dashboard.pullPolicy }}
          {{- if .Values.dashboard.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.dashboard.containerSecurityContext | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          ports:
            - name: dashboard
              containerPort: 443
              protocol: TCP
          env:
            # URL do Wazuh Indexer - formato JSON array exigido pelo Dashboard
            - name: OPENSEARCH_HOSTS
              value: '["https://{{ include "wazuh.indexer.svc" . }}:9200"]'
            # Credenciais do indexer
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.indexerCred" . }}
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.indexerCred" . }}
                  key: password
            # Credenciais do dashboard (kibanaserver)
            - name: DASHBOARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.dashboardCred" . }}
                  key: username
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.dashboardCred" . }}
                  key: password
            # Configuração TLS do servidor
            - name: SERVER_SSL_ENABLED
              value: "true"
            - name: SERVER_SSL_CERTIFICATE
              value: /usr/share/wazuh-dashboard/config/certs/dashboard.pem
            - name: SERVER_SSL_KEY
              value: /usr/share/wazuh-dashboard/config/certs/dashboard-key.pem
            - name: OPENSEARCH_SSL_CERTIFICATE_AUTHORITIES
              value: /usr/share/wazuh-dashboard/config/certs/root-ca.pem
            # URL da API do Wazuh (manager master)
            - name: WAZUH_API_URL
              value: "https://{{ include "wazuh.manager.api.svc" . }}"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.apiCred" . }}
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.apiCred" . }}
                  key: password
            {{- with .Values.dashboard.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: dashboard-certs
              mountPath: /usr/share/wazuh-dashboard/config/certs/dashboard.pem
              subPath: dashboard.pem
              readOnly: true
            - name: dashboard-certs
              mountPath: /usr/share/wazuh-dashboard/config/certs/dashboard-key.pem
              subPath: dashboard-key.pem
              readOnly: true
            - name: dashboard-certs
              mountPath: /usr/share/wazuh-dashboard/config/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
            {{- with .Values.dashboard.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
