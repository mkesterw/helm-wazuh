{{/*
=============================================================================
Wazuh Manager - Worker StatefulSet
=============================================================================
Os nós workers são responsáveis por:
  - Receber eventos dos agentes (porta 1514)
  - Comunicação com o master via cluster (porta 1516)
  - Sincronização de configurações e regras com o master

Múltiplos workers permitem escalar a capacidade de processamento de eventos.
Anti-afinidade garante que os workers fiquem em nós físicos distintos (HA).
=============================================================================
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wazuh.manager.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager-worker
spec:
  replicas: {{ .Values.manager.worker.replicas }}
  selector:
    matchLabels:
      {{- include "wazuh.manager.worker.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "wazuh.manager.cluster.svc" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "wazuh.manager.worker.selectorLabels" . | nindent 8 }}
      {{- with .Values.manager.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wazuh.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.manager.worker.podSecurityContext | nindent 8 }}

      # Anti-afinidade: distribui workers em nós físicos diferentes para HA
      {{- if .Values.manager.worker.podAntiAffinity.enabled }}
      affinity:
        {{- if .Values.manager.worker.affinity }}
        {{- toYaml .Values.manager.worker.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          {{- if eq .Values.manager.worker.podAntiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "wazuh.manager.worker.selectorLabels" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "wazuh.manager.worker.selectorLabels" . | nindent 20 }}
          {{- end }}
        {{- end }}
      {{- else if .Values.manager.worker.affinity }}
      affinity:
        {{- toYaml .Values.manager.worker.affinity | nindent 8 }}
      {{- end }}

      {{- with .Values.manager.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: wazuh-server-certs
          secret:
            secretName: {{ include "wazuh.secret.indexerCerts" . }}
        # Filebeat config com env vars (sobrescreve o baked-in com admin:admin)
        - name: filebeat-config
          configMap:
            name: {{ include "wazuh.fullname" . }}-manager-filebeat
        {{- with .Values.manager.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # Init container: copia configurações padrão para o PVC se estiver vazio
      # e corrige ossec.conf (host do indexer + caminhos de certs) em todo restart
      initContainers:
        - name: init-wazuh-etc
          image: {{ include "wazuh.image.manager" . | quote }}
          imagePullPolicy: {{ .Values.image.manager.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              if [ -z "$(ls -A /pvc-etc)" ]; then
                echo "Inicializando configurações do Wazuh Manager Worker..."
                cp -a /var/ossec/etc/* /pvc-etc/
                echo "Configurações copiadas com sucesso."
              else
                echo "Configurações já existem, pulando inicialização."
              fi
              # Corrige ossec.conf sempre: host do indexer e caminhos de certs
              # Necessário para corrigir configs legadas e novas instalações
              if [ -f /pvc-etc/ossec.conf ]; then
                echo "Corrigindo configuração do indexer no ossec.conf..."
                sed -i "s|https://0.0.0.0:9200|${INDEXER_URL}|g" /pvc-etc/ossec.conf
                sed -i "s|/etc/filebeat/certs/root-ca\.pem|/var/ossec/etc/certs/root-ca.pem|g" /pvc-etc/ossec.conf
                sed -i "s|/etc/filebeat/certs/filebeat\.pem|/var/ossec/etc/certs/server.pem|g" /pvc-etc/ossec.conf
                sed -i "s|/etc/filebeat/certs/filebeat-key\.pem|/var/ossec/etc/certs/server-key.pem|g" /pvc-etc/ossec.conf
                echo "ossec.conf corrigido com sucesso."
              fi
          env:
            - name: INDEXER_URL
              value: "https://{{ include "wazuh.indexer.svc" . }}:9200"
          volumeMounts:
            - name: wazuh-manager-worker
              mountPath: /pvc-etc
              subPath: wazuh/var/ossec/etc
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

      containers:
        - name: wazuh-manager
          image: {{ include "wazuh.image.manager" . | quote }}
          imagePullPolicy: {{ .Values.image.manager.pullPolicy }}
          securityContext:
            {{- toYaml .Values.manager.worker.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.manager.worker.resources | nindent 12 }}
          ports:
            - name: agents-events
              containerPort: 1514
              protocol: TCP
            - name: cluster
              containerPort: 1516
              protocol: TCP
          env:
            # URL do Wazuh Indexer (Filebeat + ossec.conf usam esta variável)
            - name: INDEXER_URL
              value: "https://{{ include "wazuh.indexer.svc" . }}:9200"
            # Nome do nó = nome do pod (ex: release-manager-worker-0)
            - name: WAZUH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WAZUH_NODE_TYPE
              value: "worker"
            - name: WAZUH_CLUSTER_BIND_ADDR
              value: "0.0.0.0"
            - name: WAZUH_CLUSTER_NODES
              value: {{ include "wazuh.manager.cluster.svc" . | quote }}
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.indexerCred" . }}
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.indexerCred" . }}
                  key: password
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /var/ossec/etc/certs/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /var/ossec/etc/certs/server.pem
            - name: SSL_KEY
              value: /var/ossec/etc/certs/server-key.pem
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wazuh.secret.clusterKey" . }}
                  key: key
            {{- with .Values.manager.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: wazuh-manager-worker
              mountPath: /var/ossec/api/configuration
              subPath: wazuh/var/ossec/api/configuration
            - name: wazuh-manager-worker
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-server-certs
              mountPath: /var/ossec/etc/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
            - name: wazuh-server-certs
              mountPath: /var/ossec/etc/certs/server.pem
              subPath: server.pem
              readOnly: true
            - name: wazuh-server-certs
              mountPath: /var/ossec/etc/certs/server-key.pem
              subPath: server-key.pem
              readOnly: true
            # Filebeat config com env vars (sobrescreve o baked-in com admin:admin)
            - name: filebeat-config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: wazuh-manager-worker
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-worker
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
            - name: wazuh-manager-worker
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh/var/ossec/var/multigroups
            - name: wazuh-manager-worker
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh/var/ossec/active-response/bin
            - name: wazuh-manager-worker
              mountPath: /var/ossec/wodles
              subPath: wazuh/var/ossec/wodles
            {{- with .Values.manager.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/var/ossec/bin/wazuh-control status | grep -q 'is running'"
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/var/ossec/bin/wazuh-control status | grep -q 'is running'"
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10

  # PVC template para dados persistidos dos workers
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
        labels:
          {{- include "wazuh.labels" . | nindent 10 }}
          app.kubernetes.io/component: manager-worker
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ include "wazuh.storageClass" . }}
        resources:
          requests:
            storage: {{ .Values.manager.worker.storage.size }}
