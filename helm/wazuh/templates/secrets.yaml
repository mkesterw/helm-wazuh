{{/*
=============================================================================
Secrets de credenciais do Wazuh
IMPORTANTE: Defina todas as senhas antes do primeiro helm install.
Alterar senhas após o install requer resetar os PVCs (dados stateful).
=============================================================================
*/}}

{{/* Secret de credenciais do Indexer (OpenSearch admin) */}}
{{- if not .Values.secrets.indexer.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secret.indexerCred" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.indexer.username | b64enc | quote }}
  password: {{ .Values.secrets.indexer.password | b64enc | quote }}
{{- end }}
---
{{/* Secret de credenciais do Dashboard (kibanaserver) */}}
{{- if not .Values.secrets.dashboard.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secret.dashboardCred" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.dashboard.username | b64enc | quote }}
  password: {{ .Values.secrets.dashboard.password | b64enc | quote }}
{{- end }}
---
{{/* Secret de credenciais da API do Wazuh */}}
{{- if not .Values.secrets.wazuhApi.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secret.apiCred" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.wazuhApi.username | b64enc | quote }}
  password: {{ .Values.secrets.wazuhApi.password | b64enc | quote }}
{{- end }}
---
{{/* Secret da senha de registro de agentes (authd) */}}
{{- if not .Values.secrets.authdExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secret.authdPass" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  authd.pass: {{ .Values.secrets.authdPass | b64enc | quote }}
{{- end }}
---
{{/* Secret da chave do cluster Wazuh (deve ter exatamente 32 caracteres) */}}
{{- if not .Values.secrets.clusterKeyExistingSecret }}
{{- $keyLen := len .Values.secrets.clusterKey }}
{{- if ne $keyLen 32 }}
{{- fail (printf "secrets.clusterKey deve ter exatamente 32 caracteres (atual: %d)" $keyLen) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.secret.clusterKey" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ .Values.secrets.clusterKey | b64enc | quote }}
{{- end }}
