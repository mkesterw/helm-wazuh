{{/*
=============================================================================
Wazuh Indexer - Services
=============================================================================
Headless service: usado para descoberta do cluster OpenSearch entre pods.
Cada pod recebe um DNS entry: release-indexer-N.release-indexer.<namespace>
=============================================================================
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.indexer.svc" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  # clusterIP: None = Headless Service (cada pod tem seu próprio DNS)
  clusterIP: None
  selector:
    {{- include "wazuh.indexer.selectorLabels" . | nindent 4 }}
  ports:
    - name: indexer-nodes
      port: 9300
      targetPort: 9300
      protocol: TCP
    - name: indexer-rest
      port: 9200
      targetPort: 9200
      protocol: TCP
