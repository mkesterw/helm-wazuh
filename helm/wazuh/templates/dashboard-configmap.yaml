{{/*
=============================================================================
Wazuh Dashboard - ConfigMap
=============================================================================
Fornece o opensearch_dashboards.yml que o Wazuh Dashboard 4.x exige.
O entrypoint (entrypoint.sh) adiciona opensearch.username/password ao keystore
a partir das env vars DASHBOARD_USERNAME/DASHBOARD_PASSWORD. Este arquivo
fornece o restante da configuração que o entrypoint não cobre.
=============================================================================
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.dashboard.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    server.port: 443
    server.ssl.enabled: true
    server.ssl.certificate: /usr/share/wazuh-dashboard/config/certs/dashboard.pem
    server.ssl.key: /usr/share/wazuh-dashboard/config/certs/dashboard-key.pem

    opensearch.hosts: "https://{{ include "wazuh.indexer.svc" . }}:9200"
    opensearch.ssl.verificationMode: certificate
    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/config/certs/root-ca.pem"]
    opensearch.requestHeadersAllowlist: ["securitytenant", "Authorization"]

    opensearch_security.multitenancy.enabled: false
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]

    # Rota padrão após login (mudou de /app/wazuh para /app/wz-home no Wazuh 4.x)
    uiSettings.overrides.defaultRoute: /app/wz-home

    # Sessão / cookies
    opensearch_security.session.ttl: 900000
    opensearch_security.session.keepalive: true
