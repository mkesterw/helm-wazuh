{{- if .Values.certs.generate }}
{{/*
=============================================================================
Job de Geração de Certificados TLS - Pre-install Hook
=============================================================================
Usa um único container Alpine com:
  - openssl: geração dos certificados (via apk add)
  - curl: criação dos Secrets via Kubernetes REST API (sem kubectl)

Vantagens desta abordagem:
  - Alpine tem /bin/sh (sem erro "no such file or directory")
  - Não depende de imagens kubectl (distroless, pull errors, etc.)
  - openssl e curl instalados via apk add no início do script
  - Usa o ServiceAccount token montado para autenticar na K8s API

O Job é idempotente: verifica se Secrets já existem antes de criar.
=============================================================================
*/}}

# ConfigMap com o script unificado de geração de certs + criação de Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.certgen.fullname" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-gen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  generate-and-create.sh: |
    #!/bin/sh
    set -e

    # -------------------------------------------------------------------------
    # Configuração
    # -------------------------------------------------------------------------
    NAMESPACE="${NAMESPACE}"
    INDEXER_SECRET="${INDEXER_SECRET}"
    DASHBOARD_SECRET="${DASHBOARD_SECRET}"
    COUNTRY="{{ .Values.certs.subject.country }}"
    STATE="{{ .Values.certs.subject.state }}"
    LOCALITY="{{ .Values.certs.subject.locality }}"
    ORG="{{ .Values.certs.subject.organization }}"
    OU="{{ .Values.certs.subject.organizationalUnit }}"
    DAYS="{{ .Values.certs.daysValid }}"
    INDEXER_SVC="{{ include "wazuh.indexer.svc" . }}"
    DASHBOARD_SVC="{{ include "wazuh.dashboard.svc" . }}"

    K8S_API="https://kubernetes.default.svc"
    SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    WORKDIR="/tmp/certs"
    mkdir -p "$WORKDIR"

    # -------------------------------------------------------------------------
    # Instalar dependências PRIMEIRO (curl e openssl não vêm no Alpine base)
    # -------------------------------------------------------------------------
    echo "=== Instalando dependências (openssl + curl) ==="
    apk add --no-cache openssl curl

    # -------------------------------------------------------------------------
    # Verificar Secrets existentes (idempotência)
    # -------------------------------------------------------------------------
    echo "=== Verificando Secrets existentes ==="
    check_secret() {
      curl -sk -o /dev/null -w "%{http_code}" \
        --cacert "$CA_CERT" \
        -H "Authorization: Bearer $SA_TOKEN" \
        "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets/$1"
    }

    INDEXER_STATUS=$(check_secret "$INDEXER_SECRET")
    DASHBOARD_STATUS=$(check_secret "$DASHBOARD_SECRET")

    if [ "$INDEXER_STATUS" = "200" ] && [ "$DASHBOARD_STATUS" = "200" ]; then
      echo "Secrets '$INDEXER_SECRET' e '$DASHBOARD_SECRET' já existem. Nada a fazer."
      exit 0
    fi

    # -------------------------------------------------------------------------
    # Root CA
    # -------------------------------------------------------------------------
    echo "=== Gerando Root CA ==="
    openssl genrsa -out "$WORKDIR/root-ca-key.pem" 2048
    openssl req -new -x509 -sha256 -days "$DAYS" \
      -key "$WORKDIR/root-ca-key.pem" \
      -out "$WORKDIR/root-ca.pem" \
      -subj "/C=${COUNTRY}/ST=${STATE}/L=${LOCALITY}/O=${ORG}/OU=${OU}/CN=Root CA"

    # -------------------------------------------------------------------------
    # Certificado Admin (OpenSearch security plugin)
    # -------------------------------------------------------------------------
    echo "=== Gerando cert Admin ==="
    openssl genrsa -out "$WORKDIR/admin-key.pem" 2048
    openssl req -new -sha256 \
      -key "$WORKDIR/admin-key.pem" \
      -out "$WORKDIR/admin.csr" \
      -subj "/C=${COUNTRY}/ST=${STATE}/L=${LOCALITY}/O=${ORG}/OU=${OU}/CN=admin"
    openssl x509 -req -sha256 -days "$DAYS" \
      -in "$WORKDIR/admin.csr" \
      -CA "$WORKDIR/root-ca.pem" \
      -CAkey "$WORKDIR/root-ca-key.pem" \
      -CAcreateserial \
      -out "$WORKDIR/admin.pem"

    # -------------------------------------------------------------------------
    # Certificado do Indexer (SANs para cluster OpenSearch)
    # -------------------------------------------------------------------------
    echo "=== Gerando cert Indexer ==="
    cat > /tmp/indexer-san.cnf << SANCNF
    [req]
    req_extensions = v3_req
    distinguished_name = req_dn
    [req_dn]
    [v3_req]
    subjectAltName = DNS:${INDEXER_SVC},DNS:*.${INDEXER_SVC},IP:127.0.0.1
    SANCNF
    openssl genrsa -out "$WORKDIR/indexer-key.pem" 2048
    openssl req -new -sha256 \
      -key "$WORKDIR/indexer-key.pem" \
      -out "$WORKDIR/indexer.csr" \
      -subj "/C=${COUNTRY}/ST=${STATE}/L=${LOCALITY}/O=${ORG}/OU=${OU}/CN=indexer"
    openssl x509 -req -sha256 -days "$DAYS" \
      -extensions v3_req -extfile /tmp/indexer-san.cnf \
      -in "$WORKDIR/indexer.csr" \
      -CA "$WORKDIR/root-ca.pem" \
      -CAkey "$WORKDIR/root-ca-key.pem" \
      -CAcreateserial \
      -out "$WORKDIR/indexer.pem"

    # -------------------------------------------------------------------------
    # Certificado do Manager (server cert para agentes)
    # -------------------------------------------------------------------------
    echo "=== Gerando cert Manager ==="
    openssl genrsa -out "$WORKDIR/server-key.pem" 2048
    openssl req -new -sha256 \
      -key "$WORKDIR/server-key.pem" \
      -out "$WORKDIR/server.csr" \
      -subj "/C=${COUNTRY}/ST=${STATE}/L=${LOCALITY}/O=${ORG}/OU=${OU}/CN=wazuh-manager"
    openssl x509 -req -sha256 -days "$DAYS" \
      -in "$WORKDIR/server.csr" \
      -CA "$WORKDIR/root-ca.pem" \
      -CAkey "$WORKDIR/root-ca-key.pem" \
      -CAcreateserial \
      -out "$WORKDIR/server.pem"

    # -------------------------------------------------------------------------
    # Certificado do Dashboard
    # -------------------------------------------------------------------------
    echo "=== Gerando cert Dashboard ==="
    cat > /tmp/dashboard-san.cnf << SANCNF2
    [req]
    req_extensions = v3_req
    distinguished_name = req_dn
    [req_dn]
    [v3_req]
    subjectAltName = DNS:${DASHBOARD_SVC},DNS:dashboard,IP:127.0.0.1{{ range .Values.certs.dashboard.extraSANs }},DNS:{{ . }}{{ end }}
    SANCNF2
    openssl genrsa -out "$WORKDIR/dashboard-key.pem" 2048
    openssl req -new -sha256 \
      -key "$WORKDIR/dashboard-key.pem" \
      -out "$WORKDIR/dashboard.csr" \
      -subj "/C=${COUNTRY}/ST=${STATE}/L=${LOCALITY}/O=${ORG}/OU=${OU}/CN=dashboard"
    openssl x509 -req -sha256 -days "$DAYS" \
      -extensions v3_req -extfile /tmp/dashboard-san.cnf \
      -in "$WORKDIR/dashboard.csr" \
      -CA "$WORKDIR/root-ca.pem" \
      -CAkey "$WORKDIR/root-ca-key.pem" \
      -CAcreateserial \
      -out "$WORKDIR/dashboard.pem"

    echo "=== Todos os certificados gerados ==="

    # -------------------------------------------------------------------------
    # Função: criar Secret via Kubernetes REST API
    # -------------------------------------------------------------------------
    create_secret_api() {
      SECRET_NAME="$1"
      PAYLOAD="$2"

      HTTP_STATUS=$(curl -sk -o /tmp/api_resp.json -w "%{http_code}" \
        --cacert "$CA_CERT" \
        -H "Authorization: Bearer $SA_TOKEN" \
        -H "Content-Type: application/json" \
        -X POST \
        "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets" \
        -d "$PAYLOAD")

      if [ "$HTTP_STATUS" = "201" ]; then
        echo "Secret '$SECRET_NAME' criado com sucesso (HTTP 201)."
      elif [ "$HTTP_STATUS" = "409" ]; then
        echo "Secret '$SECRET_NAME' já existe (HTTP 409), pulando."
      else
        echo "ERRO: falha ao criar Secret '$SECRET_NAME' (HTTP ${HTTP_STATUS})"
        cat /tmp/api_resp.json
        exit 1
      fi
    }

    # -------------------------------------------------------------------------
    # Criar Secret: indexer-certs
    # -------------------------------------------------------------------------
    if [ "$INDEXER_STATUS" != "200" ]; then
      echo "=== Criando Secret: $INDEXER_SECRET ==="
      B64_ROOT_CA=$(base64  "$WORKDIR/root-ca.pem"      | tr -d '\n')
      B64_INDEXER=$(base64  "$WORKDIR/indexer.pem"      | tr -d '\n')
      B64_IDX_KEY=$(base64  "$WORKDIR/indexer-key.pem"  | tr -d '\n')
      B64_ADMIN=$(base64    "$WORKDIR/admin.pem"         | tr -d '\n')
      B64_ADM_KEY=$(base64  "$WORKDIR/admin-key.pem"    | tr -d '\n')
      B64_SERVER=$(base64   "$WORKDIR/server.pem"        | tr -d '\n')
      B64_SRV_KEY=$(base64  "$WORKDIR/server-key.pem"   | tr -d '\n')

      create_secret_api "$INDEXER_SECRET" \
        "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"${INDEXER_SECRET}\",\"namespace\":\"${NAMESPACE}\"},\"data\":{\"root-ca.pem\":\"${B64_ROOT_CA}\",\"indexer.pem\":\"${B64_INDEXER}\",\"indexer-key.pem\":\"${B64_IDX_KEY}\",\"admin.pem\":\"${B64_ADMIN}\",\"admin-key.pem\":\"${B64_ADM_KEY}\",\"server.pem\":\"${B64_SERVER}\",\"server-key.pem\":\"${B64_SRV_KEY}\"}}"
    fi

    # -------------------------------------------------------------------------
    # Criar Secret: dashboard-certs
    # -------------------------------------------------------------------------
    if [ "$DASHBOARD_STATUS" != "200" ]; then
      echo "=== Criando Secret: $DASHBOARD_SECRET ==="
      B64_ROOT_CA=$(base64  "$WORKDIR/root-ca.pem"       | tr -d '\n')
      B64_DASH=$(base64     "$WORKDIR/dashboard.pem"     | tr -d '\n')
      B64_DASH_KEY=$(base64 "$WORKDIR/dashboard-key.pem" | tr -d '\n')

      create_secret_api "$DASHBOARD_SECRET" \
        "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"${DASHBOARD_SECRET}\",\"namespace\":\"${NAMESPACE}\"},\"data\":{\"root-ca.pem\":\"${B64_ROOT_CA}\",\"dashboard.pem\":\"${B64_DASH}\",\"dashboard-key.pem\":\"${B64_DASH_KEY}\"}}"
    fi

    echo "=== Job de certificados concluído com sucesso! ==="
---
# Job: container único Alpine - instala openssl e curl via apk add no início do script
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wazuh.certgen.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-gen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "wazuh.labels" . | nindent 8 }}
        app.kubernetes.io/component: cert-gen
    spec:
      serviceAccountName: {{ include "wazuh.certgen.serviceAccountName" . }}
      restartPolicy: OnFailure
      volumes:
        - name: scripts
          configMap:
            name: {{ include "wazuh.certgen.fullname" . }}-scripts
            defaultMode: 0755
      containers:
        - name: cert-gen
          image: "{{ .Values.certs.certgenImage.repository }}:{{ .Values.certs.certgenImage.tag }}"
          imagePullPolicy: {{ .Values.certs.certgenImage.pullPolicy }}
          command: ["/bin/sh", "/scripts/generate-and-create.sh"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INDEXER_SECRET
              value: {{ include "wazuh.secret.indexerCerts" . }}
            - name: DASHBOARD_SECRET
              value: {{ include "wazuh.secret.dashboardCerts" . }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
