{{/*
=============================================================================
Wazuh Manager - Filebeat ConfigMap
=============================================================================
Fornece o filebeat.yml para os pods do manager (master e workers).

Problemas resolvidos:
1. Credenciais hardcoded na imagem (admin:admin) - usa env vars do Secret
2. Facilita atualizações de configuração sem rebuildar a imagem

O wazuh-template.json permanece da imagem (montado via subPath apenas o yml).
=============================================================================
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.fullname" . }}-manager-filebeat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
data:
  filebeat.yml: |
    # Wazuh - Filebeat configuration file
    filebeat.modules:
      - module: wazuh
        alerts:
          enabled: true
        archives:
          enabled: false

    setup.template.json.enabled: true
    setup.template.overwrite: true
    setup.template.json.path: '/etc/filebeat/wazuh-template.json'
    setup.template.json.name: 'wazuh'
    setup.ilm.enabled: false

    output.elasticsearch:
      hosts: ["${INDEXER_URL}"]
      username: "${INDEXER_USERNAME}"
      password: "${INDEXER_PASSWORD}"
      ssl.certificate_authorities: ["${SSL_CERTIFICATE_AUTHORITIES}"]
      ssl.certificate: "${SSL_CERTIFICATE}"
      ssl.key: "${SSL_KEY}"

    logging.metrics.enabled: false

    seccomp:
      default_action: allow
      syscalls:
      - action: allow
        names:
        - rseq
